name: Release

on:
  push:
    branches:
      - main
  pull_request:

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  check:
    name: Lint, build and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer, wp-cli
          coverage: none

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Unit tests
        run: composer test

      - name: Lint JavaScript and styles
        run: |
          pnpm lint:js
          pnpm lint:css

      - name: Build assets
        run: pnpm build

      - name: Build translations
        run: pnpm i18n

      # Check what actually ships: the tree minus everything in .distignore,
      # with vendor/ pruned to what the release bundles.
      - name: Assemble distribution
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          mkdir -p dist/jcore-silta
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/jcore-silta/

      # vendor/ holds the jcore-update library, which is not ours to check.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/jcore-silta
          exclude-directories: vendor

  release:
    name: Bump version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      is_bumped: ${{ steps.foonver.outputs.is_bumped }}
      version: ${{ steps.foonver.outputs.version }}
      release_notes: ${{ steps.foonver.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Version sync, changelog file and format all come from .foonver.toml.
      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v1.2.0
        with:
          command: "auto"
          changelog: "true"
          push: "true"
          commit_suffix: "[skip ci]"

  publish:
    name: Build, release and notify
    needs: release
    if: needs.release.outputs.is_bumped == 'true'
    # The shared workflow creates the GitHub release. It runs with the
    # release secrets, so it is pinned to a reviewed commit rather than main;
    # move the pin deliberately when jcore-update changes.
    permissions:
      contents: write
    uses: JCO-Digital/jcore-update/.github/workflows/reusable-plugin-publish.yml@2edc1d8aaddfb21f6e3aa3b25f337097467531d5 # main after jcore-update#4
    with:
      slug: "jcore-silta"
      version: ${{ needs.release.outputs.version }}
      release_notes: ${{ needs.release.outputs.release_notes }}
      plugin_file: "jcore-silta.php"
      dist_repo: "git@git.jcore.fi:/srv/git/jcore-silta.git"
      # #jcore_updates, by ID so a rename does not break it.
      slack_channel: "CU8LPT03W"
    secrets:
      UPDATE_API_KEY: ${{ secrets.UPDATE_API_KEY }}
      DIST_REPO_SSH_KEY: ${{ secrets.DIST_REPO_SSH_KEY }}
      SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
