name: Integration

# Real pushes and pulls between two WordPress sites in Docker (dev/), checked
# with WP-CLI on the receiving side. Called by the Release workflow as its
# first job, on every pull request and push to main: lint, build and release
# run only after these checks pass. The caller passes its secrets.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  two-sites:
    name: Two-site sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gd
          tools: composer
          coverage: none

      # The sites run the plugin straight from the checkout.
      - name: Build the plugin
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist
          pnpm build

      # Gravity Forms and ACF Pro are commercial: dev/setup.sh installs them
      # from their Composer repositories only when their license key secrets
      # are set (Gravity Forms: an Elite or Developer license). Without ACF Pro
      # the sites run Secure Custom Fields. Pull requests from forks get no
      # secrets, so there the Gravity Forms checks are skipped and the ACF
      # checks run against Secure Custom Fields. Paid WooCommerce extensions
      # have no Composer repository and are never installed here.
      - name: Run the integration tests
        env:
          GRAVITY_FORMS_LICENSE_KEY: ${{ secrets.GRAVITY_FORMS_LICENSE_KEY }}
          GRAVITY_FORMS_SITE_URL: ${{ vars.GRAVITY_FORMS_SITE_URL }}
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          ACF_PRO_SITE_URL: ${{ vars.ACF_PRO_SITE_URL }}
        run: tests/integration/run.sh

      - name: Debug logs
        if: failure()
        working-directory: dev
        run: |
          for site in staging production; do
            echo "== $site"
            docker compose exec -T "$site" sh -c 'cat wp-content/debug.log 2>/dev/null || true'
          done
