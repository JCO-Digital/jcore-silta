# Local two-site stack for syncing: staging and production WordPress + MariaDB.
#   docker compose up -d && ./setup.sh
# Staging: http://localhost:8090, production: http://localhost:8091 (admin / admin).
# Gravity Forms and ACF Pro are added when dev/.env has their license keys (see
# dev/.env.example), paid WooCommerce extensions when their zips are in
# dev/woocommerce/extensions/.
# WP-CLI: docker compose exec cli-staging wp ... (or cli-production) once
# setup.sh has started them, or docker compose run --rm cli-staging wp ...
name: jcore-silta-dev

# No WORDPRESS_AUTH_KEY etc.: the image generates random salts per volume, so
# staging and production encrypt their Silta keys with different salts.
# WP_DEBUG comes from WORDPRESS_DEBUG; the image defines it before
# WORDPRESS_CONFIG_EXTRA runs, so defining it there again would warn.
x-staging-env: &staging-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: staging
  WORDPRESS_DEBUG: "1"
  # Optional, from dev/.env: pre-fill the Gravity Forms and ACF Pro licenses
  # when they are installed.
  GRAVITY_FORMS_LICENSE_KEY: ${GRAVITY_FORMS_LICENSE_KEY:-}
  ACF_PRO_LICENSE_KEY: ${ACF_PRO_LICENSE_KEY:-}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_HOME', 'http://localhost:8090' );
    define( 'WP_SITEURL', 'http://localhost:8090' );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    if ( getenv( 'GRAVITY_FORMS_LICENSE_KEY' ) ) { define( 'GF_LICENSE_KEY', getenv( 'GRAVITY_FORMS_LICENSE_KEY' ) ); }
    if ( getenv( 'ACF_PRO_LICENSE_KEY' ) ) { define( 'ACF_PRO_LICENSE', getenv( 'ACF_PRO_LICENSE_KEY' ) ); }

x-production-env: &production-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: production
  WORDPRESS_DEBUG: "1"
  # Optional, from dev/.env: pre-fill the Gravity Forms and ACF Pro licenses
  # when they are installed.
  GRAVITY_FORMS_LICENSE_KEY: ${GRAVITY_FORMS_LICENSE_KEY:-}
  ACF_PRO_LICENSE_KEY: ${ACF_PRO_LICENSE_KEY:-}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_HOME', 'http://localhost:8091' );
    define( 'WP_SITEURL', 'http://localhost:8091' );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    if ( getenv( 'GRAVITY_FORMS_LICENSE_KEY' ) ) { define( 'GF_LICENSE_KEY', getenv( 'GRAVITY_FORMS_LICENSE_KEY' ) ); }
    if ( getenv( 'ACF_PRO_LICENSE_KEY' ) ) { define( 'ACF_PRO_LICENSE', getenv( 'ACF_PRO_LICENSE_KEY' ) ); }

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  staging:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports:
      - "8090:80"
    environment: *staging-env
    volumes:
      - staging:/var/www/html
      - ..:/var/www/html/wp-content/plugins/jcore-silta:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  production:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports:
      - "8091:80"
    environment: *production-env
    volumes:
      - production:/var/www/html
      - ..:/var/www/html/wp-content/plugins/jcore-silta:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  cli-staging:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on: [db, staging]
    # Idles, so setup.sh and the integration tests can `docker compose exec`
    # WP-CLI in it: starting a new container per command cost about two
    # seconds each, and they run hundreds. `docker compose run --rm` still
    # works for a one-off command. init makes it stop at once on SIGTERM.
    command: ["sleep", "infinity"]
    init: true
    # Share the site container's network instead of getting one of its own:
    # each new network interface makes Chromium-based browsers on the host
    # abort requests with ERR_NETWORK_CHANGED. db and the other site still
    # resolve.
    network_mode: "service:staging"
    environment:
      <<: *staging-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - staging:/var/www/html
      - ..:/var/www/html/wp-content/plugins/jcore-silta:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./seed:/seed:ro
      # Commercial plugins, when dev/gravityforms/install.sh and
      # dev/acf-pro/install.sh installed them or extension zips were dropped in
      # dev/woocommerce/extensions/; setup.sh copies them into the site.
      - ./gravityforms/plugins:/gravityforms:ro
      - ./acf-pro/plugins:/acf-pro:ro
      - ./woocommerce/extensions:/woocommerce-extensions:ro

  cli-production:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on: [db, production]
    # Idles, so setup.sh and the integration tests can `docker compose exec`
    # WP-CLI in it: starting a new container per command cost about two
    # seconds each, and they run hundreds. `docker compose run --rm` still
    # works for a one-off command. init makes it stop at once on SIGTERM.
    command: ["sleep", "infinity"]
    init: true
    # Share the site container's network instead of getting one of its own:
    # each new network interface makes Chromium-based browsers on the host
    # abort requests with ERR_NETWORK_CHANGED. db and the other site still
    # resolve.
    network_mode: "service:production"
    environment:
      <<: *production-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - production:/var/www/html
      - ..:/var/www/html/wp-content/plugins/jcore-silta:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./seed:/seed:ro
      # Commercial plugins, when dev/gravityforms/install.sh and
      # dev/acf-pro/install.sh installed them or extension zips were dropped in
      # dev/woocommerce/extensions/; setup.sh copies them into the site.
      - ./gravityforms/plugins:/gravityforms:ro
      - ./acf-pro/plugins:/acf-pro:ro
      - ./woocommerce/extensions:/woocommerce-extensions:ro

  # Used once by setup.sh to copy staging's uploads into production.
  copy-uploads:
    image: alpine
    profiles: [tools]
    network_mode: none
    volumes:
      - staging:/staging:ro
      - production:/production
    command: >-
      sh -c 'rm -rf /production/wp-content/uploads
      && cp -a /staging/wp-content/uploads /production/wp-content/uploads'

volumes:
  db:
  staging:
  production:
